<!DOCTYPE html>
<html lang="ja" data-theme="card">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0d">
  <meta name="description" content="財宝・王国カードを買い集めて点を競う、1台を回して遊ぶデッキ構築の試作">
  <title>ドミニオン — カードでデッキを作って点を競う</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ドミニオン">
  <meta property="og:title" content="ドミニオン — カードでデッキを作って点を競う">
  <meta property="og:description" content="財宝・王国カードを買い集めて点を競う、1台を回して遊ぶデッキ構築の試作">
  <meta property="og:url" content="https://t-of.github.io/deck-builder/">
  <meta property="og:image" content="https://t-of.github.io/deck-builder/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ドミニオン">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <div class="host-gone" id="hostGoneBar" hidden>
      <span>ホストが切れました。</span>
      <button class="pill pill--accent" id="hostGoneBtn">代わりに進める</button>
    </div>
    <header class="bar">
      <h1 class="bar__title">ドミニオン</h1>
      <div class="log" id="log"></div>
      <div class="trashBox" id="trashBox"><p class="trashBox__count"></p><p class="trashBox__list"></p></div>
      <p class="endGauge" id="endGauge"></p>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <!-- 人数・カードの組選び -->
      <div id="setup" class="panel setup">
        <div class="setupHero">
          <p class="setupHero__eyebrow">DECK BUILDER TAVERN</p>
          <h2 class="setupHero__title">卓を整える</h2>
          <div class="setupHero__links">
            <button class="pill" id="onlineBtn">みんなのスマホで</button>
            <button class="pill" id="onlineResumeBtn" hidden>部屋に戻る</button>
            <button class="pill" id="codexBtn">図鑑</button>
            <button class="pill" id="recordsBtn">記録</button>
          </div>
        </div>

        <!-- 通信対戦: 部屋（待合）。宿の参加者とCPU席をここで決める -->
        <div class="hud setupCard" id="onlineCard" hidden>
          <p class="setupCard__title">部屋</p>
          <div class="roomCode" id="roomCode"></div>
          <div class="chipRow">
            <button class="pill" id="inviteBtn">招待する</button>
            <button class="pill" id="inviteQrBtn">QRコード</button>
          </div>
          <div class="setupSection" id="onlineQrBox" hidden></div>
          <div class="playercount" id="onlinePlayercount" hidden>
            <button data-n="2">2人</button>
            <button data-n="3">3人</button>
            <button data-n="4">4人</button>
          </div>
          <div class="setupSection" id="onlineSeatsBox"></div>
          <div class="chipRow" id="onlineSubBar" hidden></div>
          <p class="setupCard__note" id="onlineWaitNote" hidden>ホストが始めるのを待っています。</p>
          <button class="pill" id="onlineLeaveBtn">部屋を出る</button>
        </div>

        <div class="hud setupCard" id="countCard">
          <p class="setupCard__title"><span class="setupCard__no">1</span>人数を選んでください</p>
          <div class="playercount" id="playercount">
            <button data-n="2">2人</button>
            <button data-n="3">3人</button>
            <button data-n="4">4人</button>
          </div>
        </div>

        <div class="hud setupCard" id="seatsCard">
          <p class="setupCard__title"><span class="setupCard__no">2</span>席を選んでください</p>
          <div class="setupSection" id="seatsBox"></div>
          <div class="setupSection" id="speedBox" hidden></div>
        </div>

        <div class="hud setupCard" id="kingdomCard">
          <p class="setupCard__title"><span class="setupCard__no">3</span>遊ぶカードの組を選んでください</p>
          <div class="tabs" id="modeTabs">
            <button data-mode="preset">おすすめ</button>
            <button data-mode="random">おまかせ</button>
            <button data-mode="custom">自分で選ぶ</button>
          </div>
          <div id="modePane"></div>

          <p class="sectionLabel" id="previewLabel">選ばれた10種（タップで説明）</p>
          <div class="cards cards--fan" id="kingdomPreview"></div>
          <p class="sectionLabel" id="landscapePreviewLabel" hidden>選んだイベントなど</p>
          <div class="cards" id="landscapePreview"></div>
        </div>
        <div class="hud setupCard" id="settingsCard">
          <p class="setupCard__title"><span class="setupCard__no">4</span>対局の設定</p>
          <label class="toggleRow"><input type="checkbox" id="autoTreasureToggle">財宝を自動で出す（基本の財宝のみ。効果のある財宝は手で出す）</label>
          <label class="toggleRow">効果音<input type="range" id="sfxVol" min="0" max="100" step="5"></label>
          <label class="toggleRow">BGM<input type="range" id="bgmVol" min="0" max="100" step="5"></label>
        </div>
        <button class="pill pill--accent pill--start" id="startBtn" disabled>始める</button>
      </div>

      <!-- 通信対戦: 名前 -->
      <div id="onlineName" class="panel screenCard" hidden>
        <p class="screenCard__eyebrow">みんなのスマホで</p>
        <p class="panel__lead">名前</p>
        <input class="seatRow__name" id="onlineNameInput" type="text" maxlength="10" placeholder="名無し" aria-label="名前">
        <p class="screenCard__note">本名でなくてよいです。10字まで。</p>
        <button class="pill pill--accent" id="onlineNameNextBtn">次へ</button>
        <button class="pill" id="onlineNameBackBtn">もどる</button>
      </div>

      <!-- 通信対戦: 部屋を作る / コードで入る -->
      <div id="onlineChoice" class="panel screenCard" hidden>
        <p class="screenCard__eyebrow">みんなのスマホで</p>
        <button class="pill pill--accent" id="onlineCreateBtn">部屋を作る</button>
        <div class="chipRow">
          <input class="seatRow__name" id="onlineJoinCode" type="text" maxlength="4" placeholder="コード" style="text-transform:uppercase" aria-label="部屋コード">
          <button class="pill" id="onlineJoinBtn">コードで入る</button>
        </div>
        <p class="screenCard__note" id="onlineChoiceError"></p>
        <button class="pill" id="onlineChoiceBackBtn">もどる</button>
      </div>

      <!-- 手番を渡す画面 -->
      <div id="pass" class="panel screenCard" hidden>
        <p class="screenCard__eyebrow">手番の交代</p>
        <p class="panel__lead panel__lead--pass" id="passLabel"></p>
        <p class="screenCard__note">画面を渡したら押してください</p>
        <button class="pill pill--accent" id="passBtn">見る</button>
      </div>

      <!-- 対局画面 -->
      <div id="game" class="game" hidden>
        <!-- 相手（CPU・交代の人）の直前の手番のまとめ。折りたたみ帯。タップで開く -->
        <div class="turnSummaryBar" id="turnSummaryBar" hidden>
          <button class="turnSummaryBar__toggle" id="turnSummaryToggle"></button>
          <div class="turnSummaryBar__panel" id="turnSummaryPanel" hidden></div>
        </div>
        <div class="othersRow" id="othersRow"></div>
        <div class="game__table">
          <div class="othersRow" id="matsRow"></div>
          <p class="sectionLabel sectionLabel--supply">サプライ</p>
          <div class="supply" id="supply"></div>
        </div>
        <!-- 広い画面では場・手札・フェイズの欄を横に並べる（記録は上のバー） -->
        <div class="game__bottom">
          <div class="game__play">
            <p class="sectionLabel">場に出したカード</p>
            <div class="cards cards--play" id="playArea"></div>
          </div>
          <div class="game__hand">
            <p class="sectionLabel" id="shadowLabel" hidden>山札の影の札</p>
            <div class="cards cards--hand" id="shadowRow"></div>
            <p class="sectionLabel">手札</p>
            <div class="handRow">
              <div class="cards cards--hand" id="hand"></div>
              <!-- 山札と捨て札。引いた札はここから手札へ飛ぶ -->
              <div class="piles" id="piles">
                <div class="pile pile--deck" id="deckPile" role="button" tabindex="0"><span class="pile__n"></span><span class="pile__label">山札</span></div>
                <div class="pile pile--discard" id="discardPile" role="button" tabindex="0"><span class="pile__n"></span><span class="pile__label">捨て札</span></div>
              </div>
            </div>
          </div>
          <div class="game__side">
            <div class="hud">
              <p class="phasePill" id="phasePill"></p>
              <div class="hud__stats" id="stats"></div>
              <p class="turnHint" id="turnHint"></p>
              <div class="hud__buttons" id="turnButtons"></div>
            </div>
            <p class="cpuThinking" id="cpuThinking" hidden>CPU が考えています<span class="cpuThinking__dots"><span></span><span></span><span></span></span></p>
            <div class="chipRow" id="onlineSubBarGame" hidden></div>
          </div>
        </div>
      </div>

      <!-- 問い（カード効果・アタックなど） -->
      <div id="choiceOverlay" class="panel screenCard" hidden>
        <p class="screenCard__eyebrow" id="choiceWho"></p>
        <p class="panel__lead" id="choiceLabel"></p>
        <p class="screenCard__note" id="choiceCount"></p>
        <div class="cards" id="choiceGrid"></div>
        <div class="choiceButtons" id="choiceButtons"></div>
        <button class="pill pill--accent" id="choiceConfirm">決定</button>
      </div>

      <!-- 結果画面 -->
      <div id="result" class="panel screenCard screenCard--wide" hidden>
        <p class="panel__lead">結果発表</p>
        <div class="podium" id="podium"></div>
        <ol id="ranking" class="ranking"></ol>
        <div class="resultChart" id="resultChart"></div>
        <div class="resultMvp" id="resultMvp"></div>
        <div class="chipRow" id="resultActions"></div>
      </div>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ・<a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>

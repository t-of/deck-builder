<!DOCTYPE html>
<html lang="ja" data-theme="card">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2a1c">
  <meta name="description" content="財宝・王国カードを買い集めて点を競う、1台を回して遊ぶデッキ構築の試作">
  <title>deck-builder — カードでデッキを作って点を競う</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="deck-builder">
  <meta property="og:title" content="deck-builder — カードでデッキを作って点を競う">
  <meta property="og:description" content="財宝・王国カードを買い集めて点を競う、1台を回して遊ぶデッキ構築の試作">
  <meta property="og:url" content="https://t-of.github.io/deck-builder/">
  <meta property="og:image" content="https://t-of.github.io/deck-builder/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="deck-builder">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&display=swap">
  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">deck-builder</h1>
      <div class="log" id="log"></div>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <!-- 人数・カードの組選び -->
      <div id="setup" class="panel setup">
        <div class="setupHero">
          <p class="setupHero__eyebrow">DECK BUILDER TAVERN</p>
          <h2 class="setupHero__title">卓を整える</h2>
        </div>

        <div class="hud setupCard">
          <p class="setupCard__title"><span class="setupCard__no">1</span>人数を選んでください</p>
          <div class="playercount" id="playercount">
            <button data-n="2">2人</button>
            <button data-n="3">3人</button>
            <button data-n="4">4人</button>
          </div>
        </div>

        <div class="hud setupCard">
          <p class="setupCard__title"><span class="setupCard__no">2</span>席を選んでください</p>
          <div class="setupSection" id="seatsBox"></div>
          <div class="setupSection" id="speedBox" hidden></div>
        </div>

        <div class="hud setupCard">
          <p class="setupCard__title"><span class="setupCard__no">3</span>遊ぶカードの組を選んでください</p>
          <div class="tabs" id="modeTabs">
            <button data-mode="preset">おすすめ</button>
            <button data-mode="random">おまかせ</button>
            <button data-mode="custom">自分で選ぶ</button>
          </div>
          <div id="modePane"></div>

          <p class="sectionLabel" id="previewLabel">選ばれた10種（タップで説明）</p>
          <div class="cards cards--fan" id="kingdomPreview"></div>
          <p class="sectionLabel" id="landscapePreviewLabel" hidden>選んだイベントなど</p>
          <div class="cards" id="landscapePreview"></div>
        </div>
        <button class="pill pill--accent pill--start" id="startBtn" disabled>始める</button>
      </div>

      <!-- 手番を渡す画面 -->
      <div id="pass" class="panel screenCard" hidden>
        <p class="screenCard__eyebrow">手番の交代</p>
        <p class="panel__lead panel__lead--pass" id="passLabel"></p>
        <p class="screenCard__note">画面を渡したら押してください</p>
        <button class="pill pill--accent" id="passBtn">見る</button>
      </div>

      <!-- 対局画面 -->
      <div id="game" class="game" hidden>
        <div class="othersRow" id="othersRow"></div>
        <div class="game__table">
          <div class="othersRow" id="matsRow"></div>
          <p class="sectionLabel sectionLabel--supply">サプライ</p>
          <div class="supply" id="supply"></div>
          <p class="sectionLabel" id="nonSupplyLabel" hidden>サプライ外</p>
          <div class="cards" id="nonSupply"></div>
        </div>
        <!-- 広い画面では場・手札・フェイズの欄を横に並べる（記録は上のバー） -->
        <div class="game__bottom">
          <div class="game__play">
            <p class="sectionLabel">場に出したカード</p>
            <div class="cards cards--play" id="playArea"></div>
          </div>
          <div class="game__hand">
            <p class="sectionLabel" id="shadowLabel" hidden>山札の影の札</p>
            <div class="cards cards--hand" id="shadowRow"></div>
            <p class="sectionLabel">手札</p>
            <div class="cards cards--hand" id="hand"></div>
          </div>
          <div class="game__side">
            <div class="hud">
              <p class="phasePill" id="phasePill"></p>
              <div class="hud__stats" id="stats"></div>
              <p class="turnHint" id="turnHint"></p>
              <div class="hud__buttons" id="turnButtons"></div>
            </div>
            <p class="cpuThinking" id="cpuThinking" hidden>CPU が考えています<span class="cpuThinking__dots"><span></span><span></span><span></span></span></p>
          </div>
        </div>
      </div>

      <!-- 問い（カード効果・アタックなど） -->
      <div id="choiceOverlay" class="panel screenCard" hidden>
        <p class="screenCard__eyebrow" id="choiceWho"></p>
        <p class="panel__lead" id="choiceLabel"></p>
        <p class="screenCard__note" id="choiceCount"></p>
        <div class="cards" id="choiceGrid"></div>
        <div class="choiceButtons" id="choiceButtons"></div>
        <button class="pill pill--accent" id="choiceConfirm">決定</button>
      </div>

      <!-- 結果画面 -->
      <div id="result" class="panel screenCard screenCard--wide" hidden>
        <p class="panel__lead">結果発表</p>
        <div class="podium" id="podium"></div>
        <ol id="ranking" class="ranking"></ol>
        <button class="pill pill--accent" id="restartBtn">もう一度遊ぶ</button>
      </div>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ・<a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
